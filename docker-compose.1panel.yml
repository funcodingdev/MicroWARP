services:
  microwarp:
    image: ghcr.io/ccbkkb/microwarp:latest
    container_name: 1panel-microwarp
    restart: always
    network_mode: 1panel-network
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    logging:
      driver: "json-file"
      options:
        max-size: "3m"
        max-file: "3"
    volumes:
      - ./warp-data:/etc/wireguard
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
